<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <!-- Logo / Home -->
    <symbol id="icon-brand" viewBox="0 0 24 24">
      <path d="M3 11 12 3l9 8M5.5 9.5V21h13V9.5M9.5 21v-6h5v6" fill="none" stroke="currentColor"
        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>

    <!-- Candado / 100% local -->
    <symbol id="icon-local" viewBox="0 0 24 24">
      <rect x="4" y="10" width="16" height="11" rx="2" fill="none" stroke="currentColor"
        stroke-width="2" />
      <path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" />
    </symbol>

    <!-- Corazón / Wishlist -->
    <symbol id="icon-wishlist" viewBox="0 0 24 24">
      <path d="M12 20.3 4.9 13.2a4.6 4.6 0 0 1 6.5-6.5l.6.6.6-.6a4.6 4.6 0 0 1 6.5 6.5Z" fill="none"
        stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" />
    </symbol>

    <!-- Flecha hacia abajo / Selects -->
    <symbol id="icon-chevron" viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" />
    </symbol>

    <!-- Lista -->
    <symbol id="icon-list" viewBox="0 0 24 24">
      <path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </symbol>

    <!-- Moodboard (4 cuadrados) -->
    <symbol id="icon-moodboard" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor"
        stroke-width="2" />
      <rect x="14" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor"
        stroke-width="2" />
      <rect x="3" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor"
        stroke-width="2" />
      <rect x="14" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor"
        stroke-width="2" />
    </symbol>

    <!-- Agregar (Más) -->
    <symbol id="icon-add" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" />
    </symbol>

    <!-- Cancelar (Equis) -->
    <symbol id="icon-cancel" viewBox="0 0 24 24">
      <path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" />
    </symbol>

    <!-- Foto -->
    <symbol id="icon-photo" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor"
        stroke-width="1.9" />
      <circle cx="8.5" cy="9" r="1.5" fill="none" stroke="currentColor" stroke-width="1.9" />
      <path d="m21 15-4.5-4.5L7 20" fill="none" stroke="currentColor" stroke-width="1.9"
        stroke-linejoin="round" />
    </symbol>

    <!-- Tienda -->
    <symbol id="icon-store" viewBox="0 0 24 24">
      <path d="M4 9h16l-1 12H5L4 9Z" fill="none" stroke="currentColor" stroke-width="1.9"
        stroke-linejoin="round" />
      <path d="M8.5 9V6.5a3.5 3.5 0 0 1 7 0V9" fill="none" stroke="currentColor" stroke-width="1.9" />
    </symbol>

    <!-- Dimensiones (Regla) -->
    <symbol id="icon-dims" viewBox="0 0 24 24">
      <path d="M3 17 21 7M5 15l-2 4 4 1M19 9l2-4-4-1" fill="none" stroke="currentColor"
        stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>

    <!-- Finanzas (Tarjeta) -->
    <symbol id="icon-finance" viewBox="0 0 24 24">
      <rect x="2" y="5" width="20" height="14" rx="2" fill="none" stroke="currentColor"
        stroke-width="1.9" />
      <path d="M2 10h20" fill="none" stroke="currentColor" stroke-width="1.9" />
    </symbol>

    <!-- Check (Tilde) -->
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="M20 6 9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" />
    </symbol>

    <!-- Eliminar (Tacho de basura) -->
    <symbol id="icon-delete" viewBox="0 0 24 24">
      <path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13M10 11v5M14 11v5" fill="none" stroke="currentColor"
        stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>

    <!-- NUEVOS ICONOS -->

    <!-- Editar (Lápiz) -->
    <symbol id="icon-edit" viewBox="0 0 24 24">
      <path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>

    <!-- Vista Grid (Tarjetas) -->
    <symbol id="icon-grid" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7" rx="1" fill="none" stroke="currentColor"
        stroke-width="2" />
      <rect x="14" y="3" width="7" height="7" rx="1" fill="none" stroke="currentColor"
        stroke-width="2" />
      <rect x="3" y="14" width="7" height="7" rx="1" fill="none" stroke="currentColor"
        stroke-width="2" />
      <rect x="14" y="14" width="7" height="7" rx="1" fill="none" stroke="currentColor"
        stroke-width="2" />
    </symbol>

    <!-- Vista Tabla -->
    <symbol id="icon-table" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor"
        stroke-width="2" />
      <path d="M3 9h18M9 21V9" fill="none" stroke="currentColor" stroke-width="2" />
    </symbol>

    <!-- Enlace Web (Globo Terráqueo) -->
    <symbol id="icon-globe" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" />
      <path
        d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
        fill="none" stroke="currentColor" stroke-width="2" />
    </symbol>

    <!-- Tema -->
    <symbol id="icon-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2" />
      <path
        d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-monitor" viewBox="0 0 24 24">
      <rect x="2" y="3" width="20" height="14" rx="2" fill="none" stroke="currentColor"
        stroke-width="2" />
      <path d="M8 21h8M12 17v4" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" />
    </symbol>

    <!-- Buscador -->
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="2" />
      <path d="m21 21-4.3-4.3" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" />
    </symbol>

    <!-- Dashboard -->
    <symbol id="icon-chart" viewBox="0 0 24 24">
      <path d="M3 3v18h18M18 17V9M13 17V5M8 17v-3" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>

    <symbol id="icon-download" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <!-- Ícono de Historial -->
    <symbol id="icon-archive" viewBox="0 0 24 24">
      <path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" />
    </symbol>

    <!-- Ícono de Configuración (Engranaje) -->
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" />
      <path
        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" />
    </symbol>

    <!-- Ícono de Restaurar (Reloj) -->
    <symbol id="icon-history" viewBox="0 0 24 24">
      <path d="M3 3v5h5M3.05 13A9 9 0 1 0 6 5.3L3 8M12 7v5l4 2" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="18" rx="2" fill="none" stroke="currentColor"
        stroke-width="2" />
      <path d="M16 2v4M8 2v4M3 10h18" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" />
    </symbol>
  </defs>
</svg>